[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "twin"
version = "0.1.0"
description = "Galatasaray Universitesi Kent Parklari Sulama Dijital Ikiz ve Simulasyon Altyapisi"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Burak Sefa Alpsoy" }
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "cdsapi>=0.7",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
    "typer>=0.9",
    "matplotlib>=3.7",
    "requests>=2.31",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "httpx>=0.24",
]
ui = [
    "streamlit>=1.30",
    "plotly>=5.18",
]

[project.scripts]
twin = "twin.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
