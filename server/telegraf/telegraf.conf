# MQTT telemetri -> InfluxDB
# Zaman damgası olarak sunucunun alma zamanı kullanılır (düğümde gerçek saat olmayabilir).

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["sulama/+/telemetry"]
  username = "${MQTT_TELEGRAF_USER}"
  password = "${MQTT_TELEGRAF_PASS}"
  client_id = "telegraf"
  data_format = "json_v2"

  # Konudan düğüm adını etiket yap: sulama/<node>/telemetry
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "sulama/+/telemetry"
    tags = "_/node/_"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "sulama"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "soil_raw"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "soil_raw_1"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "soil_raw_2"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "soil_pct"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "soil_vwc"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temp_c"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "hum_pct"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pump_s"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "rssi"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "err"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "seq"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "up"
      type = "int"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
